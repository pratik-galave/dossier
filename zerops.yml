zerops:
  - setup: backend
    build:
      base: python@3.11
      buildCommands:
        - cd backend && pip install -r requirements.txt
      deployFiles: backend/
      cache: backend/requirements.txt
    run:
      base: python@3.11
      ports:
        - port: 8000
          httpSupport: true
      start: cd backend && uvicorn main:app --host 0.0.0.0 --port 8000
      envVariables:
        GROQ_API_KEY: $GROQ_API_KEY