zerops:
  - setup: backend
    build:
      base: python@3.11
      buildCommands:
        - pip install -r backend/requirements.txt --target backend/packages
      deployFiles: backend/
    run:
      base: python@3.11
      ports:
        - port: 8000
          httpSupport: true
      prepareCommands:
        - pip install fastapi uvicorn groq python-dotenv httpx pydantic python-multipart
      workingDir: /var/www/backend
      start: python -c "import os; print(os.getcwd()); print(os.listdir('.')); print(os.listdir('./backend') if os.path.exists('./backend') else 'no backend folder')"