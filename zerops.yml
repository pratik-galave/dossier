zerops:
  - setup: backend
    build:
      base: python@3.11
      buildCommands:
        - pip install -r backend/requirements.txt --target backend/packages
      deployFiles: backend/
    run:
      base: python@3.11
      ports:
        - port: 8000
          httpSupport: true
      prepareCommands:
        - pip install fastapi uvicorn groq python-dotenv httpx pydantic pydantic-settings python-multipart motor
      start: python -m uvicorn main:app --host 0.0.0.0 --port 8000 --app-dir /var/www/backend

  - setup: frontend
    build:
      base: nodejs@20
      buildCommands:
        - cd frontend && npm install && npm run build
      deployFiles: frontend/dist/~
    run:
      base: static