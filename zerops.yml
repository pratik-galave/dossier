zerops:
  - setup: backend
    build:
      base: python@3.11
      buildCommands:
        - cd backend && pip install -r requirements.txt
      deployFiles: backend/
    run:
      base: python@3.11
      ports:
        - port: 8000
          httpSupport: true
      prepareCommands:
        - pip install fastapi uvicorn groq python-dotenv httpx pydantic python-multipart
      start: python -c "import os; print(os.listdir('.'))"