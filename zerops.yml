zerops:
  - setup: backend
    build:
      base: python@3.11
      buildCommands:
        - cd backend && pip install -r requirements.txt
      deployFiles: backend/
    run:
      base: python@3.11
      ports:
        - port: 8000
          httpSupport: true
      start: uvicorn backend.main:app --host 0.0.0.0 --port 8000