zerops:
  - setup: dossier-backend
    build:
      base: python@3.11
      buildCommands:
        - pip install -r requirements.txt
      deployFiles: ./
    run:
      base: python@3.11
      ports:
        - port: 8000
          httpSupport: true
      start: uvicorn main:app --host 0.0.0.0 --port 8000
      envVariables:
        GROQ_API_KEY: <your_groq_key>
        MONGODB_URI: <will_be_filled_by_zerops>

  - setup: dossier-frontend
    build:
      base: nodejs@20
      buildCommands:
        - npm install
        - npm run build
      deployFiles: ./dist
    run:
      base: static
